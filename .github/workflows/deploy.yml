name: Desplegar flamingo.pe

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Simular la subida por FTPS'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: deploy-flamingo.pe
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Obtener código
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: npm

      - name: Compilar Astro
        env:
          PUBLIC_ALTOPLANTA_MAPA_URL: ${{ vars.PUBLIC_ALTOPLANTA_MAPA_URL }}
        run: |
          npm ci --no-audit --no-fund
          npm run build
          test -s dist/index.html

      - name: Comprobar secretos de despliegue
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          for name in FTP_SERVER FTP_USERNAME FTP_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Falta configurar el secreto $name en GitHub Actions"
              exit 1
            fi
          done

      - name: Sincronizar dist por FTPS
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: strict
          local-dir: ./dist/
          server-dir: ./
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          timeout: 120000
          log-level: minimal
